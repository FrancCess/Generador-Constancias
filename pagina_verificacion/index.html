<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Verificar constancia</title>
<style>
  :root { --n:#1d1b33; --o:#b8913f; --oc:#f4ead6; --ok:#2e7d4f; --mal:#c4314b; --b:#e3e3e8; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: #f4f4f7; color: #26252b; }
  header { background: var(--n); color: #fff; padding: 18px 16px; text-align: center; }
  header h1 { margin: 0; font-size: 20px; }
  header p { margin: 4px 0 0; color: #d9d6ee; font-size: 14px; }
  main { max-width: 560px; margin: 0 auto; padding: 20px 16px 40px; }
  .card { background: #fff; border: 1px solid var(--b); border-radius: 14px; padding: 20px; box-shadow: 0 4px 16px rgba(0,0,0,.05); }
  form { display: flex; gap: 8px; margin-top: 10px; }
  input { flex: 1; font-size: 18px; padding: 10px 12px; border: 1px solid #ccc; border-radius: 10px; text-transform: uppercase; letter-spacing: 1px; min-width: 0; }
  button { background: var(--o); color: #fff; border: 0; border-radius: 10px; font-size: 16px; font-weight: 600; padding: 0 16px; cursor: pointer; }
  .res { margin-top: 18px; border-radius: 12px; padding: 16px; display: none; }
  .res.ok { display: block; background: #e9f6ee; border: 1px solid #b5dfc4; }
  .res.mal { display: block; background: #fdecef; border: 1px solid #f2b8c3; }
  .res h2 { margin: 0 0 10px; font-size: 18px; }
  .res.ok h2 { color: var(--ok); } .res.mal h2 { color: var(--mal); }
  dl { display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; margin: 0; font-size: 15px; }
  dt { color: #666; } dd { margin: 0; font-weight: 600; }
  .pie { text-align: center; color: #888; font-size: 12.5px; margin-top: 18px; }
</style>
</head>
<body>
<header><h1>Verificación de constancias</h1><p id="emisor">Comprueba que una constancia es auténtica</p></header>
<main>
  <div class="card">
    <label for="c"><b>Código de verificación</b> (aparece debajo del QR de la constancia)</label>
    <form id="f"><input id="c" placeholder="ABCD-2345" autocomplete="off" maxlength="12"><button>Verificar</button></form>
    <div id="r" class="res"></div>
  </div>
  <p class="pie" id="pie"></p>
</main>
<script>
  // registro.json lo genera el programa (Historial → Exportar para página web)
  const limpiar = (c) => String(c || '').toUpperCase().replace(/[^0-9A-Z]/g, '').replace(/O/g, '0').replace(/I/g, '1');
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  let datos = null;
  const cargar = fetch('registro.json', { cache: 'no-store' }).then(r => r.json()).then(d => {
    datos = d;
    if (d.emisor) document.getElementById('emisor').textContent = d.emisor;
    document.getElementById('pie').textContent = `Registro actualizado el ${new Date(d.actualizado).toLocaleDateString('es-MX')} · ${d.total} constancias`;
  }).catch(() => { document.getElementById('pie').textContent = 'No se pudo cargar el registro de constancias.'; });
  async function verificar(codigo) {
    await cargar;
    const r = document.getElementById('r');
    const c = limpiar(codigo);
    if (!c) return;
    const x = datos && datos.registros ? datos.registros[c] : null;
    if (x) {
      r.className = 'res ok';
      r.innerHTML = `<h2>✅ Constancia válida</h2><dl>
        <dt>Nombre</dt><dd>${esc(x.n)}</dd><dt>Evento</dt><dd>${esc(x.e || '—')}</dd>
        <dt>Folio</dt><dd>${esc(x.f)}</dd>${x.d ? `<dt>Fecha</dt><dd>${esc(x.d)}</dd>` : ''}
        <dt>Emitida</dt><dd>${esc(x.t)}</dd></dl>`;
    } else {
      r.className = 'res mal';
      r.innerHTML = `<h2>❌ No encontrada</h2><p>El código <b>${esc(codigo)}</b> no está en el registro. Revisa que esté bien escrito; si la constancia es reciente, puede que el registro aún no se haya actualizado.</p>`;
    }
  }
  document.getElementById('f').addEventListener('submit', e => { e.preventDefault(); verificar(document.getElementById('c').value); });
  const p = new URLSearchParams(location.search).get('c');
  if (p) { document.getElementById('c').value = p; verificar(p); }
</script>
</body>
</html>
